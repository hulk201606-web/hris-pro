server:
  port: 8080

spring:
  application:
    name: hris-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      # 一期 5 服务路由。注意：下游各服务 controller 已持有完整前缀
      #（/api/v1/auth、/api/v1/org、/api/v1/emp、/api/v1/flow、/api/v1/plt、
      #   二期 /api/v1/att、/api/v1/rcu、/api/v1/cmp、/api/v1/prf、/api/v1/kb），
      # 因此此处【不 StripPrefix/不 RewritePath】，原样转发路径。
      # ⚠ Spring Cloud Gateway 5.x（Cloud 2025.1）配置根已迁移：
      #   spring.cloud.gateway.routes → spring.cloud.gateway.server.webflux.routes
      #   旧键名会静默失效（路由不加载、请求 fallback 到静态资源 404）。
      server:
        webflux:
          routes:
            - id: hris-auth
              uri: lb://hris-auth
              predicates:
                - Path=/api/v1/auth/**
            - id: hris-org
              uri: lb://hris-org
              predicates:
                - Path=/api/v1/org/**
            - id: hris-employee
              uri: lb://hris-employee
              predicates:
                - Path=/api/v1/emp/**
            - id: hris-flow
              uri: lb://hris-flow
              predicates:
                - Path=/api/v1/flow/**
            - id: hris-platform
              uri: lb://hris-platform
              predicates:
                - Path=/api/v1/plt/**
            # ---- 二期新增服务（考勤/招聘/薪酬/绩效/知识库）----
            - id: hris-attendance
              uri: lb://hris-attendance
              predicates:
                - Path=/api/v1/att/**
            - id: hris-recruit
              uri: lb://hris-recruit
              predicates:
                - Path=/api/v1/rcu/**
            # 官网免登录公开端点（RCS-F-004）：/api/v1/public/** 统一路由到 hris-recruit。
            # 注意与下方白名单配套使用：仅放行 JWT 校验，InternalBanWebFilter 的 /internal/ 封禁不受影响。
            # 当前仅招聘域暴露公开端点；其他域后续需要时在此拆分路由，避免把整个 /public 前缀绑死到单服务。
            - id: hris-recruit-public
              uri: lb://hris-recruit
              predicates:
                - Path=/api/v1/public/**
            - id: hris-compensation
              uri: lb://hris-compensation
              predicates:
                - Path=/api/v1/cmp/**
            - id: hris-performance
              uri: lb://hris-performance
              predicates:
                - Path=/api/v1/prf/**
            - id: hris-rag
              uri: lb://hris-rag
              predicates:
                - Path=/api/v1/kb/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  # 请求体/响应体编解码内存上限（10MB），超限由 RequestSizeGuardGlobalFilter 提前拒绝
  codec:
    max-in-memory-size: 10MB

management:
  endpoints:
    web:
      exposure:
        # 网关只暴露 health/info：白名单收口（docs/18 §3.0）只保护「命中路由的请求」，
        # 网关自身的 /actuator/** 不命中任何路由、直接 fall-through 到本服务的 WebFlux
        # handler，完全绕过 JwtAuthGlobalFilter——实测 8080/actuator/prometheus 不带 JWT
        # 返回 200（2026-11 实测）。容器部署里 8080 是唯一对外端口，等于 JVM/HTTP 指标公网可读。
        # 故网关在完成收口 2（management.server.port 隔离，见 docs/18 §3.0）之前不暴露 prometheus；
        # 指标采集缺失期间，网关侧依赖 Grafana 的 access log 指标（AccessLogGlobalFilter 落盘日志）兜底。
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # 生产环境不外泄组件明细（曾出现过的 db/redis 连接串泄露风险点）
      show-details: never
  metrics:
    tags:
      # 关键：给所有指标打上服务名标签，Prometheus 侧无需靠 job 名区分实例
      application: ${spring.application.name}
    distribution:
      # 显式声明分位数，避免不同版本的 histogram bucket 默认值漂移
      percentiles-histogram:
        http.server.requests: true
      # 延迟观测重点在 p95/p99，对齐 docs/09 NFR-P-001（P95 <= 300ms）
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 300ms, 500ms, 1000ms
# 网关 JWT 验签：与 hris-auth 同源（HS256 + 同一 JWT_SECRET 环境变量 + 同一 issuer）。
# 注意：hris-auth 的配置前缀是 auth.jwt，这里网关用 hris.jwt，但 secret 走同一个 JWT_SECRET 注入，
# 均为必填、无默认值，弱密钥/缺省密钥由 JwtSecretGuard 拒绝启动。
hris:
  jwt:
    secret: ${JWT_SECRET}
    issuer: hris-auth
  gateway:
    # 内部端点标识（公网经网关访问一律 20403 拒绝）
    internal-path-marker: /internal/
    # 请求体大小上限（字节），超限返回 413
    max-body-size-bytes: 10485760
    # 白名单路径（跳过 JWT 校验）；AntPathMatcher 语义
    whitelist:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /public/**
      # 官网免登录投递公开端点（RCS-F-004，二期批 1）：匿名可访问，跳过 JWT 校验。
      # 仅放行 /api/v1/public/** 显式公开前缀；/internal/** 仍由 InternalBanWebFilter 封禁。
      - /api/v1/public/**
      # 仅放行探针与健康检查，不放行整个 /actuator/**。
      # 安全原因：/actuator/** 一旦放行，info/env/metrics/prometheus 等端点会
      # 免 JWT 校验经网关对外可达。指标端点一旦按 docs/18 §3 暴露 prometheus，
      # 若此处仍写 /actuator/** 就等于把 JVM/DB/HTTP 指标公开到公网。
      # 需要采集指标时走 Prometheus 服务端直连容器网络，不经网关。
      - /actuator/health/**
      - /favicon.ico
    # 全局 CORS（CorsWebFilter）
    cors:
      origins:
        - ${CORS_ORIGIN:http://localhost:5173}
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Content-Type
        - Authorization
        - X-Trace-Id
        - Idempotency-Key
      allow-credentials: true
      max-age-seconds: 86400
    # Sentinel 端点限流（QPS 维度；IP 维度见 SentinelConfig 的 origin parser 预留）
    rate-limit:
      enabled: true
      rules:
        - path: /api/v1/auth/login
          qps: 10
        - path: /api/v1/auth/refresh
          qps: 20

logging:
  level:
    com.hris: info
