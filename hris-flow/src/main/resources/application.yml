server:
  port: 8104

spring:
  application:
    name: hris-flow
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/flow_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Flowable 引擎（S0.4 验证：database-schema-update 用 false 由 DDL 基线管理；验证阶段可用 true 自动建表）
flowable:
  database-schema-update: false
  async-executor-activate: false
  # 禁用 Event Registry（MVP 用不到）
  eventregistry:
    enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.hris: info
    org.flowable: info

# ---- 预置流程模板种子（FLW-F-019：启动时对预置模板幂等安装 + 部署）----
hris:
  flow:
    # 安装租户列表（逗号分隔）。flow_db 无租户主档不可自行枚举，需配置注入；
    # demo 租户为 100001；留空则跳过安装（不阻断启动）
    seed-tenants: ${FLOW_SEED_TENANTS:}
    # ---- 事件总线（FLW-F-012 / 批 12 #25）----
    # mq-enabled 缺省 false：本机与未部署 RocketMQ 的环境不装配 producer、不报错，
    # outbox 仅落表（旧行为）；部署 RocketMQ 后置 true 即恢复投递。
    outbox:
      mq-enabled: ${FLOW_OUTBOX_MQ_ENABLED:false}
      name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
      topic: ${FLOW_OUTBOX_TOPIC:hris-flow-events}
      producer-group: ${ROCKETMQ_PRODUCER_GROUP:hris-flow-outbox-producer}
      # 发送失败累计达到该次数置 DEAD（死信），避免无限重试
      max-retry: 3

# ---- 健康检查探针（K8s liveness/readiness；不暴露 env/beans/heapdump 等敏感端点）----
management:
  endpoints:
    web:
      exposure:
        # health/info/probes 供编排与探针；prometheus 供采集端（网关白名单已收口为 /actuator/health/**，见 docs/18 §3.0）
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 生产环境不外泄组件明细（曾出现过的 db/redis 连接串泄露风险点）
      show-details: never
    prometheus:
      enabled: true
  metrics:
    tags:
      # 关键：给所有指标打上服务名标签，Prometheus 侧无需靠 job 名区分实例
      application: ${spring.application.name}
    distribution:
      # 显式声明分位数，避免不同版本的 histogram bucket 默认值漂移
      percentiles-histogram:
        http.server.requests: true
      # 延迟观测重点在 p95/p99，对齐 docs/09 NFR-P-001（P95 <= 300ms）
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 300ms, 500ms, 1000ms
# ---------- OpenAPI 契约（springdoc） ----------
# 生产默认关闭：/v3/api-docs 会完整暴露端点、字段与模型结构。
# 需要导出契约时显式开启（本地/CI 已由 scripts 与 .env.example 约定）。
# 注意：网关白名单仅放行 /actuator/health/**，故本端点经网关访问需 JWT，
# 契约导出请直连容器网络端口，不要经网关。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
