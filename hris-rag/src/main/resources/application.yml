server:
  port: 8110

spring:
  application:
    name: hris-rag
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rag_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  ai:
    openai:
      # 通义千问走 DashScope OpenAI 兼容端点（ADR-005 修订：Spring AI 2.0 替代已停更的 Spring AI Alibaba）
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${MILVUS_DIMENSION:1024}
      chat:
        options:
          model: ${DASHSCOPE_CHAT_MODEL:qwen-plus}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.hris: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

hris:
  rag:
    milvus:
      host: ${MILVUS_HOST:127.0.0.1}
      port: ${MILVUS_PORT:19530}
      database: ${MILVUS_DATABASE:default}
      dimension: ${MILVUS_DIMENSION:1024}
      vector-field: embedding
      id-field: chunk_id

# ---------- OpenAPI 契约（springdoc） ----------
# 生产默认关闭：/v3/api-docs 会完整暴露端点、字段与模型结构。
# 需要导出契约时显式开启（本地/CI 已由 scripts 与 .env.example 约定）。
# 注意：网关白名单仅放行 /actuator/health/**，故本端点经网关访问需 JWT，
# 契约导出请直连容器网络端口，不要经网关。
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
