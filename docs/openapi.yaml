  /api/v1/org/headcounts:
    get:
      tags: [org]
      summary: 编制查询
      parameters:
        - in: query
          name: deptId
          schema: { type: integer, format: int64 }
        - in: query
          name: positionId
          schema: { type: integer, format: int64 }
        - in: query
          name: period
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadcountUsageListEnvelope'
    put:
      tags: [org]
      summary: 编制设定（按 dept+position+period upsert）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeadcountRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadcountUsageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/headcounts/usage:
    get:
      tags: [org]
      summary: 编制看板（在编/空缺/占用率）
      parameters:
        - in: query
          name: deptId
          schema: { type: integer, format: int64 }
        - in: query
          name: period
          schema: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeadcountUsageListEnvelope'

  /internal/org/hc/check:
    get:
      tags: [org]
      summary: 编制校验（内部，EMP/RCU 域调用）
      parameters:
        - in: query
          name: dept
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: position
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: count
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HcCheckResponseEnvelope'

  /internal/org/reportline/{empId}:
    get:
      tags: [org]
      summary: 汇报线解析（内部）
      parameters:
        - in: path
          name: empId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功（data 为汇报线员工 ID 链，直属上级优先）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: integer
                          format: int64

  # ===================== employee =====================
  /api/v1/emp/employees:
    get:
      tags: [employee]
      summary: 花名册多维筛选 + 分页
      parameters:
        - in: query
          name: name
          schema: { type: string }
          description: 姓名模糊
        - in: query
          name: empNo
          schema: { type: string }
          description: 工号精确
        - in: query
          name: status
          schema: { type: integer }
          description: 在职状态码（0 待入职 1 试用 2 在职 3 离职中 4 已离职 5 已取消 6 退休 7 黑名单）
        - in: query
          name: deptId
          schema: { type: integer, format: int64 }
        - in: query
          name: positionId
          schema: { type: integer, format: int64 }
        - in: query
          name: hireType
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeBriefPageEnvelope'
    post:
      tags: [employee]
      summary: 建档（状态=待入职）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeCreateRequest'
      responses:
        '200':
          description: 建档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeProfileResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/emp/employees/{id}:
    get:
      tags: [employee]
      summary: 档案详情（默认脱敏，证件/手机仅密域角色回明文）
      parameters:
        - in: path
