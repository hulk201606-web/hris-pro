  /api/v1/org/legal-entities:
    get:
      tags: [org]
      summary: 法人主体列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
    post:
      tags: [org]
      summary: 创建法人主体
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/legal-entities/{id}:
    put:
      tags: [org]
      summary: 更新法人主体
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
