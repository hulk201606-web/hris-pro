# =============================================================================
# 【已废弃 / DEPRECATED】本文件不再是契约的权威来源，请勿据它开发。
#
# 现状：本文件为早期手工维护的契约，仅覆盖 auth/org/employee 三个服务、
#       124 个 path，且不含二期 rcu/cmp/prf/kb 四个模块。
#
# 权威契约：docs/openapi.gen.json（221 个 path / 10 个模块 / 542 个 schema）
#           由 scripts/gen-openapi.py 从各服务的 /v3/api-docs 自动聚合生成，
#           前端类型由 openapi-typescript 从它生成到
#           frontend/src/api/generated/api.d.ts。
#
# 保留原因：本文件含手写的中文业务描述与字段说明，作为文档阅读仍有价值；
#           但接口结构以生成物为准。
#
# 修改方式：不要编辑本文件。改后端 Controller 后重新执行
#           python scripts/gen-openapi.py && (cd frontend && npm run gen:api)
# =============================================================================

openapi: 3.0.3
info:
  title: 智云 HR - 认证授权 / 组织管理 / 员工管理 API
  version: 1.0.0
  description: |
    Phase 3 一期增量：hris-auth / hris-org / hris-employee 三服务的字段级 API 契约。
    契约对齐《12 数据库详细设计》DDL 列，统一响应体 {code,message,data,traceId,timestamp}。
    认证：Authorization: Bearer <JWT>；多租户：租户上下文取自 JWT（网关校验后透传 X-Tenant-Id）。
servers:
  - url: http://localhost:8080
tags:
  - name: auth
    description: 认证授权（登录/刷新/登出/当前用户/菜单/MFA/内部建号）
  - name: org
    description: 组织管理（部门树/法人/岗位/职务/职级/职级带/编制/汇报线）
  - name: employee
    description: 员工管理（花名册/档案/入职转正调动离职/合同/黑名单）
  - name: flow
    description: 流程中台（发起/撤回/待办/任务操作/轨迹/模型部署）
  - name: platform
    description: 平台支撑（文件/通知/字典/审计/租户参数/报表）
  - name: att
    description: 假勤管理（考勤组/班次/排班/打卡/日考勤/异常/假期额度/请假加班出差补卡/月结/报表）

paths:
  # ===================== auth =====================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 账号密码登录（MVP 简化版）
      description: 返回 access/refresh JWT。验证码与 MFA 逐步认证后续增量接入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 刷新令牌（轮换）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 登出（撤销 access 与 refresh）
      parameters:
        - in: header
          name: Authorization
          schema: { type: string }
          required: false
          description: Bearer <accessToken>
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 当前用户 + 权限摘要 + 租户品牌
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/menus:
    get:
      tags: [auth]
      summary: 当前用户菜单树（由权限点派生）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/MenuNode'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mfa/bind:
    post:
      tags: [auth]
      summary: 绑定 MFA（TOTP），返回密钥与 otpauth URI
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaBindResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: 校验 TOTP 动态码（敏感操作二次认证）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /internal/auth/accounts:
    post:
      tags: [auth]
      summary: 入职建号（内部，EMP 域调用）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '200':
          description: 建号成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCreateResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /internal/auth/accounts/{empId}/disable:
    put:
      tags: [auth]
      summary: 离职禁用账号（内部，EMP 域调用）
      parameters:
        - in: path
          name: empId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: tenantId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 禁用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== org =====================
  /api/v1/org/depts:
    get:
      tags: [org]
      summary: 部门树/列表查询
      parameters:
        - in: query
          name: tree
          schema: { type: boolean, default: false }
          description: true=返回嵌套树，false=返回扁平当前生效部门
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeptNode'
    post:
      tags: [org]
      summary: 创建部门（版本化生效）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeptNodeEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/depts/{id}:
    put:
      tags: [org]
      summary: 更新部门（写历史快照后变更）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeptNodeEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/org/depts/{id}/snapshot:
    get:
      tags: [org]
      summary: 部门历史快照
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: at
          schema: { type: string, format: date }
          description: 快照日期（ISO-8601，缺省取最新）
      responses:
        '200':
          description: 成功（data 为快照对象，含 deptId/snapshotDate 及部门字段）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/org/depts/adjust-requests:
    post:
      tags: [org]
      summary: 发起组织调整申请（ORG_ADJUST 流程，MVP 落单 + 预留 flow）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustRequestCreate'
      responses:
        '200':
          description: 落单成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustRequestResponseEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/positions:
    get:
      tags: [org]
      summary: 岗位列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
    post:
      tags: [org]
      summary: 创建岗位
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/positions/{id}:
    put:
      tags: [org]
      summary: 更新岗位
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [org]
      summary: 删除岗位（逻辑删除）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/org/jobs:
    get:
      tags: [org]
      summary: 职务列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
    post:
      tags: [org]
      summary: 创建职务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/jobs/{id}:
    put:
      tags: [org]
      summary: 更新职务
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [org]
      summary: 删除职务（逻辑删除）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/org/grades:
    get:
      tags: [org]
      summary: 职级列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
    post:
      tags: [org]
      summary: 创建职级
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/grades/{id}:
    put:
      tags: [org]
      summary: 更新职级
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [org]
      summary: 删除职级（逻辑删除）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/org/bands:
    get:
      tags: [org]
      summary: 职级带列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogListEnvelope'
    post:
      tags: [org]
      summary: 创建职级带
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/org/bands/{id}:
    put:
      tags: [org]
      summary: 更新职级带
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [org]
      summary: 删除职级带（逻辑删除）
      parameters:
        - in: path
          name: id
          required: true
